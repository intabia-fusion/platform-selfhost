    location /_logs {
        auth_basic "QA tools";
        auth_basic_user_file /etc/nginx/qa/.htpasswd;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dozzle streams logs over SSE and needs unbuffered, long-lived connections.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400;
        # The host nginx in front buffers too; this header is the only way to switch it off from here.
        add_header X-Accel-Buffering no always;
        proxy_pass http://dozzle:8080;
    }

    location ~ ^/_stand/?$ {
        auth_basic "QA tools";
        auth_basic_user_file /etc/nginx/qa/.htpasswd;
        root /etc/nginx/qa;
        try_files /stand.html =404;
    }
